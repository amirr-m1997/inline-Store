services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_store}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    working_dir: /app
    volumes: [./backend:/app]
    env_file: .env
    ports: ["8005:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    working_dir: /app
    volumes: [./backend:/app]
    env_file: .env
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    command: npm run dev
    working_dir: /app
    volumes: [./frontend:/app, /app/node_modules]
    environment: [NEXT_PUBLIC_API_URL=http://localhost:8005]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
