# CI: keeps main green. Mirrors the verified local gates:
#   frontend -> tsc + eslint + vitest
#   backend  -> manage.py check + full Django suite (SQLite, no external services)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test settings: dev-mode auth flows on (mock gateway default follows
      # DEBUG), throwaway secret. Mirrors backend/.env used by local runs.
      DEBUG: "True"
      SECRET_KEY: ci-insecure-secret-key-for-tests-only
      # OTP debug-code bypass stays OFF here on purpose: the suite asserts it
      # is only exposed under an explicit flag (see test_auth.py).
    steps:
      - uses: actions/checkout@v4
      - name: Install DejaVu system font (latin PDF typography test)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt
      - run: pip install -r requirements/base.txt
      - run: python manage.py check
      - run: python manage.py test
